<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4f7a">
  <title>Corretor de Gabarito</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Corretor de Gabarito</h1>
    <select id="prova-ativa" aria-label="Prova ativa"></select>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="provas"><span class="ico">📋</span>Provas</button>
    <button data-tab="corrigir"><span class="ico">📷</span>Corrigir</button>
    <button data-tab="resultados"><span class="ico">📊</span>Resultados</button>
    <button data-tab="alunos"><span class="ico">👥</span>Alunos</button>
  </nav>

  <div id="print-area"></div>
  <div id="toast" role="status"></div>
  <div id="busy" hidden>
    <div class="spinner"></div>
    <p>Lendo a folha…</p>
  </div>

  <input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-gallery" accept="image/*" multiple hidden>
  <input type="file" id="file-alunos" accept=".txt,.csv,text/plain,text/csv" hidden>

  <script src="js/omr.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
